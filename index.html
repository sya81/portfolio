<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Song Yun A Portfolio</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="hero">
    <h1>Song Yun A Portfolio</h1>
    <p>Welcome to my portfolio website.</p>
  </header>

  <main>
    <section class="about">
      <h2>ABOUT ME</h2>
      <p>안녕하세요. 저의 포트폴리오 페이지입니다.</p>
    </section>

    <section class="projects">
      <h2>PROJECTS</h2>
      <div class="project-card">
        <h3>My Portfolio</h3>
        <p>HTML, CSS, JavaScript를 활용한 포트폴리오 웹사이트입니다.</p>
      </div>
    </section>

    <section class="contact">
      <h2>LET'S TALK</h2>
      <p>문의 사항이 있다면 아래 양식을 작성해주세요.</p>

      <form id="contactForm" novalidate>
        <div class="form-group">
          <label for="name">Name</label>
          <input type="text" id="name" name="name" placeholder="이름을 입력하세요" />
          <small class="error-message" id="nameError"></small>
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="email@example.com" />
          <small class="error-message" id="emailError"></small>
        </div>

        <div class="form-group">
          <label for="message">Message</label>
          <textarea id="message" name="message" rows="5" placeholder="메시지를 입력하세요"></textarea>
          <small class="error-message" id="messageError"></small>
        </div>

        <button type="submit">Submit</button>
        <p id="formResult" class="form-result"></p>
      </form>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
